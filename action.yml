name: CAD CI same-runner run
description: Run the exact released CAD-CI stack and optionally publish one durable build scope on the same runner.

inputs:
  source_sha:
    description: Exact caller source commit to check out and run.
    required: true
  base_sha:
    description: Exact base commit used for run-only incremental selection.
    required: false
    default: ""
  full_run:
    description: Run every configured process:true item in run-only mode.
    required: false
    default: "false"
  jobs:
    description: Maximum parallel SCons jobs; must be a positive integer.
    required: false
    default: "1"
  environment_json:
    description: Optional non-secret environment values for consumer commands.
    required: false
    default: "{}"
  github_token:
    description: GitHub token used only for generic GHCR authentication.
    required: true
  durable_scope:
    description: Optional durable build scope. main uses stable semantics; another safe name uses named-scope semantics.
    required: false
    default: ""
  source_ref:
    description: Source ref recorded in durable publication provenance. Required when durable_scope is set.
    required: false
    default: ""

outputs:
  library_revision:
    description: Exact lib.py.cad.ci commit pinned by this tool revision.
    value: ${{ steps.library.outputs.revision }}
  scope:
    description: Durable scope name, or empty in run-only mode.
    value: ${{ steps.durable.outputs.scope }}
  base_sha:
    description: Effective exact base commit used for selection.
    value: ${{ steps.selection.outputs.base_sha }}
  full_run:
    description: Effective full-run decision.
    value: ${{ steps.selection.outputs.full_run }}
  scope_exists:
    description: Whether the durable scope existed before this run.
    value: ${{ steps.durable.outputs.scope_exists }}
  build_commit:
    description: Published durable build commit, or empty in run-only mode.
    value: ${{ steps.durable_publish.outputs.build_commit }}
  prepared_scope:
    description: Absolute prepared durable-scope path, or empty in run-only mode.
    value: ${{ steps.durable_publish.outputs.prepared_scope }}

runs:
  using: composite
  steps:
    - name: Validate run inputs
      shell: bash
      env:
        CAD_CI_SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
        CAD_CI_FULL_RUN: ${{ inputs.full_run }}
        CAD_CI_BASE_SHA_INPUT: ${{ inputs.base_sha }}
        CAD_CI_JOBS_INPUT: ${{ inputs.jobs }}
        CAD_CI_DURABLE_SCOPE: ${{ inputs.durable_scope }}
        CAD_CI_SOURCE_REF: ${{ inputs.source_ref }}
      run: |
        if [[ ! "$CAD_CI_SOURCE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
          echo "ERROR: source_sha must contain exactly 40 lowercase hex characters" >&2
          exit 2
        fi
        case "$CAD_CI_FULL_RUN" in
          true|false) ;;
          *)
            echo "ERROR: full_run must be true or false" >&2
            exit 2
            ;;
        esac
        case "$CAD_CI_JOBS_INPUT" in
          ''|*[!0-9]*|0)
            echo "ERROR: jobs must be a positive integer" >&2
            exit 2
            ;;
        esac

        if [ -n "$CAD_CI_DURABLE_SCOPE" ]; then
          if [ -n "$CAD_CI_BASE_SHA_INPUT" ] || [ "$CAD_CI_FULL_RUN" != "false" ]; then
            echo "ERROR: durable mode resolves base_sha and full_run automatically" >&2
            exit 2
          fi
          if [ -z "$CAD_CI_SOURCE_REF" ]; then
            echo "ERROR: durable mode requires source_ref" >&2
            exit 2
          fi
        elif [ "$CAD_CI_FULL_RUN" = "false" ] && [ -z "$CAD_CI_BASE_SHA_INPUT" ]; then
          echo "ERROR: incremental CAD CI requires base_sha" >&2
          exit 2
        fi

    - name: Checkout caller source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha }}
        fetch-depth: 1
        fetch-tags: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: "3.12"

    - name: Resolve pinned CAD CI library revision
      id: library
      shell: bash
      run: |
        python "$GITHUB_ACTION_PATH/scripts/reusable_ci.py" library-revision \
          --tool-root "$GITHUB_ACTION_PATH" \
          --github-output "$GITHUB_OUTPUT"

    - name: Checkout pinned CAD CI library source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: brainboxemb/lib.py.cad.ci
        ref: ${{ steps.library.outputs.revision }}
        path: .cache/cad-ci-lib-source
        fetch-depth: 1
        fetch-tags: false
        persist-credentials: false

    - name: Expose exact CAD CI source stack
      shell: bash
      run: |
        echo "CAD_CI_TOOL_ROOT=$GITHUB_ACTION_PATH" >> "$GITHUB_ENV"
        echo "CAD_CI_LIB_ROOT=$GITHUB_WORKSPACE/.cache/cad-ci-lib-source" >> "$GITHUB_ENV"
        echo "PYTHONPATH=$GITHUB_ACTION_PATH:$GITHUB_WORKSPACE/.cache/cad-ci-lib-source${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

    - name: Install external CAD CI runtime dependencies
      shell: bash
      run: >-
        python -m pip install --disable-pip-version-check
        --no-deps --no-compile
        "PyYAML>=6.0" "SCons==4.11.1"

    - name: Resolve durable build scope
      id: durable
      if: inputs.durable_scope != ''
      shell: bash
      env:
        CAD_CI_DURABLE_SCOPE: ${{ inputs.durable_scope }}
        CAD_CI_SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
      run: |
        python "$GITHUB_ACTION_PATH/scripts/reusable_ci.py" durable-resolve \
          --repo . \
          --scope "$CAD_CI_DURABLE_SCOPE" \
          --source-sha "$CAD_CI_SOURCE_SHA_INPUT" \
          --generated-build generated-build \
          --github-output "$GITHUB_OUTPUT"

    - name: Resolve effective selection
      id: selection
      shell: bash
      env:
        CAD_CI_DURABLE_SCOPE: ${{ inputs.durable_scope }}
        INPUT_BASE_SHA: ${{ inputs.base_sha }}
        INPUT_FULL_RUN: ${{ inputs.full_run }}
        DURABLE_BASE_SHA: ${{ steps.durable.outputs.base_sha }}
        DURABLE_FULL_RUN: ${{ steps.durable.outputs.full_run }}
      run: |
        if [ -n "$CAD_CI_DURABLE_SCOPE" ]; then
          echo "base_sha=$DURABLE_BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "full_run=$DURABLE_FULL_RUN" >> "$GITHUB_OUTPUT"
        else
          echo "base_sha=$INPUT_BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "full_run=$INPUT_FULL_RUN" >> "$GITHUB_OUTPUT"
        fi

    - name: Fetch exact base commit
      if: steps.selection.outputs.full_run == 'false'
      shell: bash
      env:
        CAD_CI_BASE_SHA_INPUT: ${{ steps.selection.outputs.base_sha }}
      run: |
        if ! git cat-file -e "$CAD_CI_BASE_SHA_INPUT^{commit}" 2>/dev/null; then
          git fetch --no-tags --depth=1 origin "$CAD_CI_BASE_SHA_INPUT"
        fi

    - name: Remove Git checkout credentials before run-only execution
      if: inputs.durable_scope == ''
      shell: bash
      run: |
        # Keep the exact-base fetch authenticated for private repositories.
        # Run-only consumer code never requires the checkout's Git token.
        git config --local --unset-all http.https://github.com/.extraheader || :

    - name: Authenticate Docker to GHCR
      shell: bash
      env:
        GHCR_TOKEN: ${{ inputs.github_token }}
      run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Run selected CAD CI graph
      shell: bash
      env:
        CAD_CI_CONSUMER_ENV_JSON: ${{ inputs.environment_json }}
        CAD_CI_SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
        CAD_CI_BASE_SHA_INPUT: ${{ steps.selection.outputs.base_sha }}
        CAD_CI_FULL_RUN: ${{ steps.selection.outputs.full_run }}
        CAD_CI_JOBS_INPUT: ${{ inputs.jobs }}
      run: |
        python "$GITHUB_ACTION_PATH/scripts/reusable_ci.py" run \
          --repo . \
          --source-sha "$CAD_CI_SOURCE_SHA_INPUT" \
          --base-sha "$CAD_CI_BASE_SHA_INPUT" \
          --full-run "$CAD_CI_FULL_RUN" \
          --jobs "$CAD_CI_JOBS_INPUT"

    - name: Publish durable build scope
      id: durable_publish
      if: inputs.durable_scope != ''
      shell: bash
      env:
        CAD_CI_DURABLE_SCOPE: ${{ inputs.durable_scope }}
        CAD_CI_SOURCE_REF: ${{ inputs.source_ref }}
        CAD_CI_SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
        CAD_CI_BASE_SHA_INPUT: ${{ steps.selection.outputs.base_sha }}
        CAD_CI_FULL_RUN: ${{ steps.selection.outputs.full_run }}
        CAD_CI_SCOPE_EXISTS: ${{ steps.durable.outputs.scope_exists }}
      run: |
        python "$GITHUB_ACTION_PATH/scripts/reusable_ci.py" durable-publish \
          --repo . \
          --scope "$CAD_CI_DURABLE_SCOPE" \
          --source-sha "$CAD_CI_SOURCE_SHA_INPUT" \
          --source-ref "$CAD_CI_SOURCE_REF" \
          --base-sha "$CAD_CI_BASE_SHA_INPUT" \
          --scope-exists "$CAD_CI_SCOPE_EXISTS" \
          --full-run "$CAD_CI_FULL_RUN" \
          --generated-build generated-build \
          --candidate-root build \
          --prepared-scope prepared-scope \
          --github-output "$GITHUB_OUTPUT"
