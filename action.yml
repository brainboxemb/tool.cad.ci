name: CAD CI same-runner run
description: Run the exact released CAD-CI stack and optionally publish one durable build scope on the same runner.

inputs:
  source_sha:
    description: Exact caller source commit to check out and run.
    required: true
  base_sha:
    description: Exact base commit for run-only incremental selection; leave empty in durable mode.
    required: false
    default: ""
  full_run:
    description: Run every configured process:true item in run-only mode; durable mode resolves this automatically.
    required: false
    default: "false"
  jobs:
    description: Maximum parallel SCons jobs; must be a positive integer.
    required: false
    default: "1"
  environment_json:
    description: Optional non-secret environment values for consumer commands.
    required: false
    default: "{}"
  github_token:
    description: GitHub token used for generic GHCR authentication and durable publication.
    required: true
  durable_scope:
    description: Optional long-lived build scope such as main, dev-cad or dev-ci.
    required: false
    default: ""
  source_ref:
    description: Source ref recorded in durable publication provenance; required in durable mode.
    required: false
    default: ""

outputs:
  library_revision:
    description: Exact lib.py.cad.ci commit pinned by this tool revision.
    value: ${{ steps.library.outputs.revision }}
  scope:
    description: Durable scope, or empty in run-only mode.
    value: ${{ steps.selection.outputs.scope }}
  base_sha:
    description: Effective incremental base resolved by the action.
    value: ${{ steps.selection.outputs.base_sha }}
  full_run:
    description: Effective full-run decision.
    value: ${{ steps.selection.outputs.full_run }}
  scope_exists:
    description: Whether the durable scope existed before this run.
    value: ${{ steps.selection.outputs.scope_exists }}
  build_commit:
    description: Published durable build commit, or empty in run-only mode.
    value: ${{ steps.durable_publish.outputs.build_commit }}
  prepared_scope:
    description: Absolute prepared durable scope path, or empty in run-only mode.
    value: ${{ steps.durable_publish.outputs.prepared_scope }}

runs:
  using: composite
  steps:
    - name: Validate run inputs
      shell: bash
      env:
        CAD_CI_SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
        CAD_CI_FULL_RUN: ${{ inputs.full_run }}
        CAD_CI_BASE_SHA_INPUT: ${{ inputs.base_sha }}
        CAD_CI_JOBS_INPUT: ${{ inputs.jobs }}
        CAD_CI_DURABLE_SCOPE: ${{ inputs.durable_scope }}
        CAD_CI_SOURCE_REF: ${{ inputs.source_ref }}
      run: |
        if ! [[ "$CAD_CI_SOURCE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
          echo "ERROR: source_sha must be an exact 40-character Git SHA" >&2
          exit 2
        fi
        case "$CAD_CI_FULL_RUN" in
          true|false) ;;
          *)
            echo "ERROR: full_run must be true or false" >&2
            exit 2
            ;;
        esac
        case "$CAD_CI_JOBS_INPUT" in
          ''|*[!0-9]*|0)
            echo "ERROR: jobs must be a positive integer" >&2
            exit 2
            ;;
        esac

        if [ -n "$CAD_CI_DURABLE_SCOPE" ]; then
          if [ -n "$CAD_CI_BASE_SHA_INPUT" ]; then
            echo "ERROR: durable mode resolves base_sha automatically" >&2
            exit 2
          fi
          if [ "$CAD_CI_FULL_RUN" != "false" ]; then
            echo "ERROR: durable mode resolves full_run automatically" >&2
            exit 2
          fi
          if [ -z "$CAD_CI_SOURCE_REF" ]; then
            echo "ERROR: source_ref is required in durable mode" >&2
            exit 2
          fi
        elif [ "$CAD_CI_FULL_RUN" = "false" ] && [ -z "$CAD_CI_BASE_SHA_INPUT" ]; then
          echo "ERROR: incremental CAD CI requires base_sha" >&2
          exit 2
        fi

    - name: Checkout caller source
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha }}
        fetch-depth: 1
        fetch-tags: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Resolve pinned CAD CI library revision
      id: library
      shell: bash
      run: |
        python "$GITHUB_ACTION_PATH/scripts/reusable_ci.py" library-revision \
          --tool-root "$GITHUB_ACTION_PATH" \
          --github-output "$GITHUB_OUTPUT"

    - name: Checkout pinned CAD CI library source
      uses: actions/checkout@v4
      with:
        repository: brainboxemb/lib.py.cad.ci
        ref: ${{ steps.library.outputs.revision }}
        path: .cache/cad-ci-lib-source
        fetch-depth: 1
        fetch-tags: false

    - name: Expose exact CAD CI source stack
      shell: bash
      run: |
        echo "CAD_CI_TOOL_ROOT=$GITHUB_ACTION_PATH" >> "$GITHUB_ENV"
        echo "CAD_CI_LIB_ROOT=$GITHUB_WORKSPACE/.cache/cad-ci-lib-source" >> "$GITHUB_ENV"
        echo "PYTHONPATH=$GITHUB_ACTION_PATH:$GITHUB_WORKSPACE/.cache/cad-ci-lib-source${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

    - name: Install external CAD CI runtime dependencies
      shell: bash
      run: >-
        python -m pip install --disable-pip-version-check
        --no-deps --no-compile
        "PyYAML>=6.0" "SCons==4.11.1"

    - name: Resolve effective selection
      id: selection
      shell: bash
      env:
        CAD_CI_DURABLE_SCOPE: ${{ inputs.durable_scope }}
        CAD_CI_SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
        CAD_CI_BASE_SHA_INPUT: ${{ inputs.base_sha }}
        CAD_CI_FULL_RUN_INPUT: ${{ inputs.full_run }}
      run: |
        if [ -n "$CAD_CI_DURABLE_SCOPE" ]; then
          python "$GITHUB_ACTION_PATH/scripts/reusable_ci.py" durable-resolve \
            --repo . \
            --generated-build .cache/cad-ci-generated-build \
            --scope "$CAD_CI_DURABLE_SCOPE" \
            --source-sha "$CAD_CI_SOURCE_SHA_INPUT" \
            --github-output "$GITHUB_OUTPUT"
        else
          echo "scope=" >> "$GITHUB_OUTPUT"
          echo "base_sha=$CAD_CI_BASE_SHA_INPUT" >> "$GITHUB_OUTPUT"
          echo "full_run=$CAD_CI_FULL_RUN_INPUT" >> "$GITHUB_OUTPUT"
          echo "scope_exists=false" >> "$GITHUB_OUTPUT"
          echo "generated_build=" >> "$GITHUB_OUTPUT"
        fi

    - name: Fetch exact incremental base commit
      if: ${{ steps.selection.outputs.full_run == 'false' }}
      shell: bash
      env:
        CAD_CI_EFFECTIVE_BASE_SHA: ${{ steps.selection.outputs.base_sha }}
      run: git fetch --no-tags --depth=1 origin "$CAD_CI_EFFECTIVE_BASE_SHA"

    - name: Authenticate Docker to GHCR
      shell: bash
      env:
        GHCR_TOKEN: ${{ inputs.github_token }}
      run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Run selected CAD CI graph
      shell: bash
      env:
        CAD_CI_CONSUMER_ENV_JSON: ${{ inputs.environment_json }}
        CAD_CI_SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
        CAD_CI_BASE_SHA_EFFECTIVE: ${{ steps.selection.outputs.base_sha }}
        CAD_CI_FULL_RUN_EFFECTIVE: ${{ steps.selection.outputs.full_run }}
        CAD_CI_JOBS_INPUT: ${{ inputs.jobs }}
      run: |
        python "$GITHUB_ACTION_PATH/scripts/reusable_ci.py" run \
          --repo . \
          --source-sha "$CAD_CI_SOURCE_SHA_INPUT" \
          --base-sha "$CAD_CI_BASE_SHA_EFFECTIVE" \
          --full-run "$CAD_CI_FULL_RUN_EFFECTIVE" \
          --jobs "$CAD_CI_JOBS_INPUT"

    - name: Publish durable build scope
      id: durable_publish
      if: ${{ inputs.durable_scope != '' }}
      shell: bash
      env:
        CAD_CI_SCOPE: ${{ steps.selection.outputs.scope }}
        CAD_CI_SCOPE_EXISTS: ${{ steps.selection.outputs.scope_exists }}
        CAD_CI_BASE_SHA: ${{ steps.selection.outputs.base_sha }}
        CAD_CI_SOURCE_SHA: ${{ inputs.source_sha }}
        CAD_CI_SOURCE_REF: ${{ inputs.source_ref }}
        CAD_CI_GENERATED_BUILD: ${{ steps.selection.outputs.generated_build }}
      run: |
        python "$GITHUB_ACTION_PATH/scripts/reusable_ci.py" durable-publish \
          --repo . \
          --generated-build "$CAD_CI_GENERATED_BUILD" \
          --prepared-scope .cache/cad-ci-prepared-scope \
          --candidate-root build \
          --scope "$CAD_CI_SCOPE" \
          --scope-exists "$CAD_CI_SCOPE_EXISTS" \
          --source-sha "$CAD_CI_SOURCE_SHA" \
          --base-sha "$CAD_CI_BASE_SHA" \
          --source-ref "$CAD_CI_SOURCE_REF" \
          --github-output "$GITHUB_OUTPUT"
