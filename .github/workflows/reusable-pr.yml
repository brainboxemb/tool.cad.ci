name: Reusable CAD CI PR

on:
  workflow_call:
    inputs:
      full_run:
        description: Run every configured item instead of using the PR diff.
        required: false
        type: boolean
        default: false
      jobs:
        description: Maximum parallel SCons jobs; must be a positive integer.
        required: false
        type: number
        default: 1
      environment_json:
        description: Optional non-secret environment values for consumer commands.
        required: false
        type: string
        default: "{}"

permissions:
  contents: write
  packages: read

concurrency:
  group: cad-ci-pr-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr:
    runs-on: ubuntu-latest
    env:
      CAD_CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      CAD_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      TOOL_ROOT: ${{ github.workspace }}/.cache/cad-ci-tool-source
      LIB_ROOT: ${{ github.workspace }}/.cache/cad-ci-lib-source
      PYTHONPATH: ${{ github.workspace }}/.cache/cad-ci-tool-source:${{ github.workspace }}/.cache/cad-ci-lib-source

    steps:
      - name: Checkout caller source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.action == 'closed' && github.event.repository.default_branch || github.event.pull_request.head.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Fetch exact PR base commit
        if: github.event.action != 'closed' && !inputs.full_run
        run: git fetch --no-tags --depth=1 origin "$CAD_CI_BASE_SHA"

      - name: Checkout called tool revision
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cache/cad-ci-tool-source
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve pinned CAD CI library revision
        id: library
        run: |
          python "$TOOL_ROOT/scripts/reusable_ci.py" library-revision \
            --tool-root "$TOOL_ROOT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout pinned CAD CI library source
        uses: actions/checkout@v4
        with:
          repository: brainboxemb/lib.py.cad.ci
          ref: ${{ steps.library.outputs.revision }}
          path: .cache/cad-ci-lib-source
          fetch-depth: 1

      - name: Install external CAD CI runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --no-deps --no-compile
          "PyYAML>=6.0" "SCons==4.11.1"

      - name: Authenticate Docker to GHCR
        if: github.event.action != 'closed'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run selected CAD CI graph
        if: github.event.action != 'closed'
        env:
          CAD_CI_CONSUMER_ENV_JSON: ${{ inputs.environment_json }}
        run: |
          python "$TOOL_ROOT/scripts/reusable_ci.py" run \
            --repo . \
            --source-sha "$CAD_CI_SOURCE_SHA" \
            --base-sha "$CAD_CI_BASE_SHA" \
            --full-run "${{ inputs.full_run }}" \
            --jobs "${{ inputs.jobs }}"

      - name: Check materialized build output
        id: build_output
        if: github.event.action != 'closed'
        shell: bash
        run: |
          if [ -d build ] && find build -mindepth 1 -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare affected PR build scope
        if: >-
          github.event.action != 'closed' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.build_output.outputs.available == 'true'
        run: |
          python -m cad_ci_tool build prepare-pr \
            --repo . \
            --candidate-root build \
            --out prepared-build \
            --source-commit "$CAD_CI_SOURCE_SHA" \
            --pull-request "$PR_NUMBER" \
            --base "$CAD_CI_BASE_SHA" \
            --head "$CAD_CI_SOURCE_SHA"

      - name: Publish affected PR build scope
        if: >-
          github.event.action != 'closed' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.build_output.outputs.available == 'true'
        env:
          SOURCE_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          python -m cad_ci_tool publish build \
            --repo . \
            --candidate prepared-build \
            --scope pr \
            --pull-request "$PR_NUMBER" \
            --message "build: PR #$PR_NUMBER affected items" \
            --source-ref "$SOURCE_REF" \
            --expected-source "$CAD_CI_SOURCE_SHA"

      - name: Remove closed PR build scope
        if: >-
          github.event.action == 'closed' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python -m cad_ci_tool publish build-cleanup \
            --repo . \
            --pull-request "$PR_NUMBER" \
            --message "build: cleanup PR #$PR_NUMBER"
