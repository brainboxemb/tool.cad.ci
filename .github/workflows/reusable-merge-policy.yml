name: Reusable merge policy

# Public API contract: docs/api.md and docs/merge-policy.md.
# This workflow only supplies GitHub runner/permissions/credentials; the
# validated merge command and recovery status live in scripts/merge_command.py.

on:
  workflow_call:
    inputs:
      command:
        description: Owner command; /merge or reviewed multiline /merge-resolved.
        required: true
        type: string
      pull_request_number:
        description: Pull request number in the caller repository.
        required: true
        type: number
      stable_ref:
        description: Stable integration branch.
        required: false
        type: string
        default: main
      lane_refs_json:
        description: JSON list of long-lived development lane refs.
        required: true
        type: string
      permanent_refs_json:
        description: JSON list of additional permanent/generated refs that cleanup must never delete.
        required: false
        type: string
        default: '["build","gh-pages"]'
      temporary_prefixes_json:
        description: JSON allow-list of temporary branch prefixes eligible for post-merge deletion.
        required: false
        type: string
        default: '["issue/","fix/","feature/","accept/","promote/","docs/","chore/"]'
      integration_workflow:
        description: Optional caller workflow file/name to dispatch after merge; empty disables dispatch.
        required: false
        type: string
        default: ""
      resolution_prefix:
        description: Branch prefix reserved for reviewed conflict-resolution refs.
        required: false
        type: string
        default: "resolve/"

permissions:
  contents: read

jobs:
  merge:
    if: (inputs.command == '/merge' || startsWith(inputs.command, '/merge-resolved')) && github.actor == github.repository_owner
    # Merge, ref lifecycle, comments and optional workflow_dispatch are
    # privileged operations. Only this job receives elevated permissions.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      statuses: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Serialise *all* merge commands in one repository, not just commands
      # for the same PR; concurrent PRs may target the same durable branch.
      group: merge-policy-${{ github.repository }}
      cancel-in-progress: false
    env:
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pull_request_number }}
      TOOL_ROOT: ${{ github.workspace }}/.cache/cad-ci-tool-source
      STABLE_REF: ${{ inputs.stable_ref }}
      LANE_REFS_JSON: ${{ inputs.lane_refs_json }}
      PERMANENT_REFS_JSON: ${{ inputs.permanent_refs_json }}
      TEMPORARY_PREFIXES_JSON: ${{ inputs.temporary_prefixes_json }}
      INTEGRATION_WORKFLOW: ${{ inputs.integration_workflow }}
      RESOLUTION_PREFIX: ${{ inputs.resolution_prefix }}
    steps:
      - name: Checkout called tool revision
        # Immutable revision of actions/checkout v4 (same trusted pin used by CAD).
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cache/cad-ci-tool-source
          fetch-depth: 1
          persist-credentials: false

      - name: Execute merge and report outcome
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND: ${{ inputs.command }}
          ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 "$TOOL_ROOT/scripts/merge_command.py" \
            --command "$COMMAND" \
            --repository "$REPOSITORY" \
            --pull-request-number "$PR_NUMBER" \
            --actor "$ACTOR" \
            --repository-owner "$REPOSITORY_OWNER" \
            --stable-ref "$STABLE_REF" \
            --lane-refs-json "$LANE_REFS_JSON" \
            --permanent-refs-json "$PERMANENT_REFS_JSON" \
            --temporary-prefixes-json "$TEMPORARY_PREFIXES_JSON" \
            --integration-workflow "$INTEGRATION_WORKFLOW" \
            --current-run-id "$CURRENT_RUN_ID" \
            --resolution-prefix "$RESOLUTION_PREFIX"
