# Public normal-consumer run-only entry point; owns cancellation.
# Calls reusable-run.yml at this same tool revision. Contract: docs/api.md.

name: Reusable CAD CI

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact caller source commit; defaults to the triggering source commit.
        required: false
        type: string
        default: ""
      base_sha:
        description: Base commit for incremental selection; defaults to the triggering event base.
        required: false
        type: string
        default: ""
      full_run:
        description: Run every configured item instead of using a Git diff.
        required: false
        type: boolean
        default: false
      item:
        description: Optional exact CAD-CI item id for a targeted read-only run.
        required: false
        type: string
        default: ""
      changed_paths:
        description: Optional newline-separated repository-relative paths for explicit affected-item selection.
        required: false
        type: string
        default: ""
      pull_request_policy:
        description: Optional JSON object describing stable/development/docs-only pull-request policy.
        required: false
        type: string
        default: ""
      jobs:
        description: Maximum parallel SCons jobs; must be a positive integer.
        required: false
        type: number
        default: 1
      command_environment:
        description: Optional JSON object of non-secret string environment values for consumer commands.
        required: false
        type: string
        default: "{}"
      upload_build:
        description: Upload the materialized build tree for a downstream consumer job.
        required: false
        type: boolean
        default: false
      build_artifact_name:
        description: Artifact name used when upload_build is true.
        required: false
        type: string
        default: "cad-ci-build"
    outputs:
      build_artifact_name:
        description: Uploaded build artifact name, or empty when upload_build is false.
        value: ${{ jobs.cad_ci.outputs.build_artifact_name }}

permissions:
  contents: read
  packages: read

concurrency:
  group: cad-ci-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cad_ci:
    uses: ./.github/workflows/reusable-run.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      base_sha: ${{ inputs.base_sha }}
      full_run: ${{ inputs.full_run }}
      item: ${{ inputs.item }}
      changed_paths: ${{ inputs.changed_paths }}
      pull_request_policy: ${{ inputs.pull_request_policy }}
      jobs: ${{ inputs.jobs }}
      command_environment: ${{ inputs.command_environment }}
      upload_build: ${{ inputs.upload_build }}
      build_artifact_name: ${{ inputs.build_artifact_name }}
