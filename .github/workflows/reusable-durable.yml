# Public one-runner permanent-branch durable lifecycle.
# Root cad-ci.yml owns builders and optional publication.pages configuration.

name: Reusable CAD CI durable

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact caller source commit to build and publish.
        required: true
        type: string
      source_ref:
        description: Permanent caller branch whose freshness guards publication.
        required: true
        type: string
      scope:
        description: Complete durable scope; main for stable or a safe named scope.
        required: true
        type: string
      build_branch:
        description: Generated build branch used for durable scope state and publication.
        required: false
        type: string
        default: build
      pages_branch:
        description: Generated Pages branch used when publication.pages is configured.
        required: false
        type: string
        default: gh-pages
      jobs:
        description: Maximum parallel SCons jobs; must be a positive integer.
        required: false
        type: number
        default: 1
      environment_json:
        description: Optional non-secret environment values for consumer commands.
        required: false
        type: string
        default: "{}"
    outputs:
      build_commit:
        description: Published generated build-branch commit.
        value: ${{ jobs.durable.outputs.build_commit }}
      pages_commit:
        description: Published generated Pages-branch commit, or empty when Pages is not configured.
        value: ${{ jobs.durable.outputs.pages_commit }}

permissions:
  contents: write
  packages: read

concurrency:
  group: cad-ci-durable-${{ github.repository }}-${{ github.workflow }}-${{ inputs.scope }}
  cancel-in-progress: true

jobs:
  durable:
    runs-on: ubuntu-latest
    outputs:
      build_commit: ${{ steps.publish.outputs.build_commit }}
      pages_commit: ${{ steps.publish.outputs.pages_commit }}
    env:
      CAD_CI_SOURCE_SHA: ${{ inputs.source_sha }}
      CAD_CI_SOURCE_REF: ${{ inputs.source_ref }}
      CAD_CI_SCOPE: ${{ inputs.scope }}
      TOOL_ROOT: ${{ github.workspace }}/.cache/cad-ci-tool-source
      LIB_ROOT: ${{ github.workspace }}/.cache/cad-ci-lib-source
      GENERATED_BUILD: ${{ github.workspace }}/.cache/cad-ci-generated-build
      PREPARED_SCOPE: ${{ github.workspace }}/.cache/cad-ci-prepared-scope
      PYTHONPATH: ${{ github.workspace }}/.cache/cad-ci-tool-source:${{ github.workspace }}/.cache/cad-ci-lib-source

    steps:
      - name: Checkout caller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: true

      - name: Checkout called tool revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cache/cad-ci-tool-source
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Resolve exact pinned CAD CI library revision
        id: library
        run: |
          python "$TOOL_ROOT/scripts/reusable_ci.py" library-revision \
            --tool-root "$TOOL_ROOT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout pinned CAD CI library source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: brainboxemb/lib.py.cad.ci
          ref: ${{ steps.library.outputs.revision }}
          path: .cache/cad-ci-lib-source
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Install external CAD CI runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --no-deps --no-compile
          "PyYAML>=6.0" "SCons==4.11.1"

      - name: Resolve durable scope state
        id: state
        run: |
          python "$TOOL_ROOT/scripts/reusable_ci.py" durable-state \
            --repo . \
            --generated-build "$GENERATED_BUILD" \
            --scope "$CAD_CI_SCOPE" \
            --source-sha "$CAD_CI_SOURCE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Fetch exact durable base revision
        if: steps.state.outputs.full_run != 'true'
        env:
          BASE_SHA: ${{ steps.state.outputs.base_sha }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

      - name: Authenticate Docker to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run selected CAD CI graph
        env:
          CAD_CI_CONSUMER_ENV_JSON: ${{ inputs.environment_json }}
        run: |
          python "$TOOL_ROOT/scripts/reusable_ci.py" run \
            --repo . \
            --source-sha "$CAD_CI_SOURCE_SHA" \
            --base-sha "${{ steps.state.outputs.base_sha }}" \
            --full-run "${{ steps.state.outputs.full_run }}" \
            --jobs "${{ inputs.jobs }}"

      - name: Publish durable build and Pages
        id: publish
        run: |
          python "$TOOL_ROOT/scripts/reusable_ci.py" durable-publish \
            --repo . \
            --generated-build "$GENERATED_BUILD" \
            --prepared-scope "$PREPARED_SCOPE" \
            --candidate-root build \
            --scope "${{ steps.state.outputs.scope }}" \
            --base-sha "${{ steps.state.outputs.base_sha }}" \
            --full-run "${{ steps.state.outputs.full_run }}" \
            --exists "${{ steps.state.outputs.exists }}" \
            --source-sha "$CAD_CI_SOURCE_SHA" \
            --source-ref "$CAD_CI_SOURCE_REF" \
            --github-output "$GITHUB_OUTPUT"
