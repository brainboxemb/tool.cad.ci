# Public advanced selection-only API. Returns plan JSON and exact source/base SHAs.
# It does not run or publish; normal execution uses reusable-ci.yml. Contract: docs/api.md.

name: Reusable CAD CI plan

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact caller source commit; defaults to the triggering source commit.
        required: false
        type: string
        default: ""
      base_sha:
        description: Base commit for incremental selection; defaults to the triggering event base.
        required: false
        type: string
        default: ""
      full_run:
        description: Select every configured item instead of using a Git diff.
        required: false
        type: boolean
        default: false
    outputs:
      plan_json:
        description: Compact JSON array returned by cad-ci plan.
        value: ${{ jobs.plan.outputs.plan_json }}
      source_sha:
        description: Exact caller source commit used by the plan.
        value: ${{ jobs.plan.outputs.source_sha }}
      base_sha:
        description: Base commit used by the plan.
        value: ${{ jobs.plan.outputs.base_sha }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan_json: ${{ steps.plan.outputs.plan_json }}
      source_sha: ${{ steps.refs.outputs.source_sha }}
      base_sha: ${{ steps.refs.outputs.base_sha }}
    env:
      CAD_CI_SOURCE_SHA: ${{ inputs.source_sha != '' && inputs.source_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      CAD_CI_BASE_SHA: ${{ inputs.base_sha != '' && inputs.base_sha || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '') }}
      TOOL_ROOT: ${{ github.workspace }}/.cache/cad-ci-tool-source
      LIB_ROOT: ${{ github.workspace }}/.cache/cad-ci-lib-source
      PYTHONPATH: ${{ github.workspace }}/.cache/cad-ci-tool-source:${{ github.workspace }}/.cache/cad-ci-lib-source

    steps:
      - name: Checkout caller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CAD_CI_SOURCE_SHA }}
          fetch-depth: 1
          fetch-tags: false
          # Only needed for exact-base fetch on private caller repositories.
          # Removed before any consumer-provided command or configuration is run.
          persist-credentials: true

      - name: Checkout called tool revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cache/cad-ci-tool-source
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Resolve exact pinned CAD CI library revision
        id: library
        run: |
          python "$TOOL_ROOT/scripts/reusable_ci.py" library-revision \
            --tool-root "$TOOL_ROOT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout pinned CAD CI library source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: brainboxemb/lib.py.cad.ci
          ref: ${{ steps.library.outputs.revision }}
          path: .cache/cad-ci-lib-source
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Install external CAD CI dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --no-deps --no-compile
          "PyYAML>=6.0" "SCons==4.11.1"

      - name: Fetch exact base revision for incremental selection
        if: "!inputs.full_run"
        env:
          BASE_SHA: ${{ env.CAD_CI_BASE_SHA }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "ERROR: incremental CAD CI requires base SHA" >&2
            exit 2
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

      - name: Drop caller Git credentials before consumer execution
        shell: bash
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || :

      - name: Record source revisions
        id: refs
        run: |
          echo "source_sha=$CAD_CI_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$CAD_CI_BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Plan selected CAD CI items
        id: plan
        run: |
          python .cache/cad-ci-tool-source/scripts/reusable_ci.py plan \
            --repo . \
            --source-sha "$CAD_CI_SOURCE_SHA" \
            --base-sha "$CAD_CI_BASE_SHA" \
            --full-run "${{ inputs.full_run }}" \
            --github-output "$GITHUB_OUTPUT"
