# Internal single-run implementation used by reusable-ci.yml.
# Not a supported direct consumer API. Optional PR development-branch policy can skip
# expensive CAD-CI bootstrap on a docs-only development-branch PR.

name: Reusable CAD CI run

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact caller source commit; defaults to the triggering source commit.
        required: false
        type: string
        default: ""
      base_sha:
        description: Base commit for incremental selection; defaults to the triggering event base.
        required: false
        type: string
        default: ""
      full_run:
        description: Run every configured item instead of using a Git diff.
        required: false
        type: boolean
        default: false
      item:
        description: Optional exact CAD-CI item id for a targeted read-only run.
        required: false
        type: string
        default: ""
      changed_paths:
        description: Optional JSON list of repository-relative paths for explicit affected-item selection.
        required: false
        type: string
        default: ""
      pull_request_policy:
        description: Optional JSON object describing stable/development/docs-only pull-request policy.
        required: false
        type: string
        default: ""
      jobs:
        description: Maximum parallel SCons jobs; must be a positive integer.
        required: false
        type: number
        default: 1
      command_environment:
        description: Optional JSON object of non-secret string environment values for consumer commands.
        required: false
        type: string
        default: "{}"
      upload_build:
        description: Upload the materialized build tree for a downstream consumer job.
        required: false
        type: boolean
        default: false
      build_artifact_name:
        description: Artifact name used when upload_build is true.
        required: false
        type: string
        default: "cad-ci-build"
    outputs:
      build_artifact_name:
        description: Uploaded build artifact name, or empty when upload_build is false.
        value: ${{ jobs.run.outputs.build_artifact_name }}

permissions:
  contents: read
  packages: read

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      build_artifact_name: ${{ steps.build_artifact.outputs.name }}
    env:
      CAD_CI_SOURCE_SHA: ${{ inputs.source_sha != '' && inputs.source_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      CAD_CI_BASE_SHA: ${{ inputs.base_sha != '' && inputs.base_sha || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '') }}
      TOOL_ROOT: ${{ github.workspace }}/.cache/cad-ci-tool-source
      LIB_ROOT: ${{ github.workspace }}/.cache/cad-ci-lib-source
      PYTHONPATH: ${{ github.workspace }}/.cache/cad-ci-tool-source:${{ github.workspace }}/.cache/cad-ci-lib-source

    steps:
      - name: Checkout caller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CAD_CI_SOURCE_SHA }}
          fetch-depth: 1
          fetch-tags: false
          # Private-repository base fetch may need this read-scoped credential.
          # It is removed immediately after the exact base is materialized.
          persist-credentials: true

      - name: Fetch exact base revision for incremental selection
        if: >-
          !inputs.full_run &&
          (
            (inputs.item == '' && inputs.changed_paths == '') ||
            (inputs.pull_request_policy != '' && github.event_name == 'pull_request')
          )
        env:
          BASE_SHA: ${{ env.CAD_CI_BASE_SHA }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "ERROR: incremental CAD CI requires base SHA" >&2
            exit 2
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

      - name: Drop caller Git credentials after exact base fetch
        shell: bash
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || :

      - name: Checkout called tool revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cache/cad-ci-tool-source
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Classify configured development-branch pull request
        id: pr_policy
        if: inputs.pull_request_policy != ''
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 "$TOOL_ROOT/scripts/reusable_ci.py" pr-policy \
            --repo . \
            --policy-json '${{ inputs.pull_request_policy }}' \
            --event-name "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF" \
            --base-sha "$CAD_CI_BASE_SHA" \
            --source-sha "$CAD_CI_SOURCE_SHA" \
            --full-run "${{ inputs.full_run }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve effective CAD CI selection
        id: selection
        shell: bash
        env:
          INPUT_FULL_RUN: ${{ inputs.full_run }}
          POLICY_RUN_CAD: ${{ steps.pr_policy.outputs.run_cad }}
          POLICY_FULL_RUN: ${{ steps.pr_policy.outputs.full_run }}
          POLICY_CLASSIFICATION: ${{ steps.pr_policy.outputs.classification }}
        run: |
          if [ "$POLICY_RUN_CAD" = "false" ]; then
            echo "run_cad=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_cad=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$INPUT_FULL_RUN" = "true" ] || [ "$POLICY_FULL_RUN" = "true" ]; then
            echo "full_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "full_run=false" >> "$GITHUB_OUTPUT"
          fi
          echo "classification=${POLICY_CLASSIFICATION:-default}" >> "$GITHUB_OUTPUT"

      - name: Report docs-only development-branch validation
        if: steps.selection.outputs.run_cad == 'false'
        shell: bash
        run: >-
          echo "CAD-CI bootstrap skipped:
          ${{ steps.selection.outputs.classification }}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.selection.outputs.run_cad == 'true'
        with:
          python-version: "3.12"

      - name: Resolve exact pinned CAD CI library revision
        id: library
        if: steps.selection.outputs.run_cad == 'true'
        run: |
          python "$TOOL_ROOT/scripts/reusable_ci.py" library-revision \
            --tool-root "$TOOL_ROOT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout pinned CAD CI library source
        if: steps.selection.outputs.run_cad == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: brainboxemb/lib.py.cad.ci
          ref: ${{ steps.library.outputs.revision }}
          path: .cache/cad-ci-lib-source
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Install external CAD CI dependencies
        if: steps.selection.outputs.run_cad == 'true'
        run: >-
          python -m pip install --disable-pip-version-check
          --no-deps --no-compile
          "PyYAML>=6.0" "SCons==4.11.1"

      - name: Authenticate Docker to GHCR
        if: steps.selection.outputs.run_cad == 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run selected CAD CI graph
        if: steps.selection.outputs.run_cad == 'true'
        env:
          CAD_CI_CONSUMER_ENV_JSON: ${{ inputs.command_environment }}
          CAD_CI_TARGET_ITEM: ${{ inputs.item }}
          CAD_CI_CHANGED_PATHS_INPUT: ${{ inputs.changed_paths }}
        run: |
          python "$TOOL_ROOT/scripts/reusable_ci.py" run \
            --repo . \
            --source-sha "$CAD_CI_SOURCE_SHA" \
            --base-sha "$CAD_CI_BASE_SHA" \
            --full-run "${{ steps.selection.outputs.full_run }}" \
            --item "$CAD_CI_TARGET_ITEM" \
            --changed-paths "$CAD_CI_CHANGED_PATHS_INPUT" \
            --jobs "${{ inputs.jobs }}"

      - name: Check materialized build output
        id: build_output
        if: steps.selection.outputs.run_cad == 'true' && inputs.upload_build
        shell: bash
        run: |
          if [ -d build ] && find build -mindepth 1 -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record build artifact name
        id: build_artifact
        if: steps.selection.outputs.run_cad == 'true' && inputs.upload_build && steps.build_output.outputs.available == 'true'
        run: echo "name=${{ inputs.build_artifact_name }}" >> "$GITHUB_OUTPUT"

      - name: Upload CAD CI build output
        if: steps.selection.outputs.run_cad == 'true' && inputs.upload_build && steps.build_output.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.build_artifact_name }}
          path: build/
          include-hidden-files: true
          if-no-files-found: error
