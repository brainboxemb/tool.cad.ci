name: Reusable CAD CI run

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact caller source commit; defaults to the triggering source commit.
        required: false
        type: string
        default: ""
      base_sha:
        description: Base commit for incremental selection; defaults to the triggering event base.
        required: false
        type: string
        default: ""
      full_run:
        description: Run every configured item instead of using a Git diff.
        required: false
        type: boolean
        default: false
      environment_json:
        description: Optional non-secret environment values for consumer commands.
        required: false
        type: string
        default: "{}"
      upload_build:
        description: Upload the materialized build tree for a downstream consumer job.
        required: false
        type: boolean
        default: false
      build_artifact_name:
        description: Artifact name used when upload_build is true.
        required: false
        type: string
        default: "cad-ci-build"
    outputs:
      build_artifact_name:
        description: Uploaded build artifact name, or empty when upload_build is false.
        value: ${{ jobs.run.outputs.build_artifact_name }}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      build_artifact_name: ${{ steps.build_artifact.outputs.name }}
    env:
      CAD_CI_SOURCE_SHA: ${{ inputs.source_sha != '' && inputs.source_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      CAD_CI_BASE_SHA: ${{ inputs.base_sha != '' && inputs.base_sha || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '') }}

    steps:
      - name: Checkout caller source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CAD_CI_SOURCE_SHA }}
          fetch-depth: 0

      - name: Checkout called tool revision
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cache/cad-ci-tool-source
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install called tool revision
        run: python -m pip install -e .cache/cad-ci-tool-source

      - name: Restore CAD CI SCons cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/cad-ci
          key: cad-ci-${{ runner.os }}-${{ github.repository_id }}-${{ job.workflow_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cad-ci-${{ runner.os }}-${{ github.repository_id }}-${{ job.workflow_sha }}-

      - name: Run selected CAD CI graph
        env:
          CAD_CI_CONSUMER_ENV_JSON: ${{ inputs.environment_json }}
        run: |
          python .cache/cad-ci-tool-source/scripts/reusable_ci.py run \
            --repo . \
            --source-sha "$CAD_CI_SOURCE_SHA" \
            --base-sha "$CAD_CI_BASE_SHA" \
            --full-run "${{ inputs.full_run }}"

      - name: Record build artifact name
        id: build-artifact
        if: inputs.upload_build
        run: echo "name=${{ inputs.build_artifact_name }}" >> "$GITHUB_OUTPUT"

      - name: Upload CAD CI build output
        if: inputs.upload_build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build_artifact_name }}
          path: build/
          include-hidden-files: true
          if-no-files-found: error

      - name: Save CAD CI SCons cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .cache/cad-ci
          key: ${{ steps.cache.outputs.cache-primary-key }}
