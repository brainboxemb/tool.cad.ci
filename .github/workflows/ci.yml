# Repository-only CI: tests the exact source stack and publishes a release
# only when VERSION changed on accepted main. Not a consumer API.
# Architecture and API evidence: docs/api.md / docs/plan.md.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      release_required: ${{ steps.release_gate.outputs.required }}
    steps:
      - name: Checkout exact tool source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Check if VERSION changed on main push
        if: github.event_name == 'push'
        id: release_gate
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS_SHA" ] ||
             [ "$PREVIOUS_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$PREVIOUS_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$PREVIOUS_SHA"
          fi
          if git diff --quiet "$PREVIOUS_SHA" "$GITHUB_SHA" -- VERSION; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove checkout token before testing tool source
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || :

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Resolve exact library pin from tool metadata
        id: library
        run: |
          python scripts/reusable_ci.py library-revision \
            --tool-root . --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact pinned CAD-CI library
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: brainboxemb/lib.py.cad.ci
          ref: ${{ steps.library.outputs.revision }}
          path: .cache/cad-ci-lib-source
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Install only external test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --no-deps --no-compile
          "PyYAML>=6.0" "SCons==4.11.1"

      - name: Test exact source stack
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.cache/cad-ci-lib-source
        run: python -m unittest discover -s tests -v

  release:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.test.outputs.release_required == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Publish exact VERSION release after successful tests
        run: python scripts/publish_release.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
