# template: tool.cad.ci/cad-ci
# template-version: 1
#
# Public run-only CAD-CI workflow.
# Replace TOOL_CAD_CI_RELEASE_SHA with one immutable released tool.cad.ci SHA.

name: CAD CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: read

jobs:
  cad-ci:
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-ci.yml@TOOL_CAD_CI_RELEASE_SHA
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
