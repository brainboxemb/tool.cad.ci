# template: tool.cad.ci/cad-ci-same-runner
# template-version: 1
#
# Same-runner pattern for a trusted durable branch that needs consumer-owned
# work after CAD-CI. Replace TOOL_CAD_CI_RELEASE_SHA with one immutable release.

name: CAD CI durable lane

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  cad-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Run released CAD-CI stack
        id: cad
        uses: brainboxemb/tool.cad.ci@TOOL_CAD_CI_RELEASE_SHA
        with:
          source_sha: ${{ github.sha }}
          durable_scope: ${{ github.ref_name }}
          source_ref: ${{ github.ref_name }}
          github_token: ${{ github.token }}

      # Add repository-owned post-run steps here. The exact released
      # cad_ci_tool stack and steps.cad outputs remain available on this runner.
