# template: tool.cad.ci/cad-ci-lanes
# template-version: 1
#
# Pull-request validation for repositories with stable main plus dev-cad/dev-ci.
# Replace TOOL_CAD_CI_RELEASE_SHA with one immutable released tool.cad.ci SHA.
# Change lane refs/docs prefixes only when repository policy intentionally differs.

name: CAD CI lanes

on:
  pull_request:
    branches: [main, dev-cad, dev-ci]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: read

jobs:
  cad-ci:
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-ci.yml@TOOL_CAD_CI_RELEASE_SHA
    with:
      pr_policy_json: '{"stable_ref":"main","lane_refs":["dev-cad","dev-ci"],"docs_only_prefixes":["docs/"]}'
