# template: tool.cad.ci/merge-policy
# template-version: 1
#
# Owner-issued /merge command for repositories with main + dev-cad + dev-ci.
# Replace TOOL_CAD_CI_RELEASE_SHA with one immutable released tool.cad.ci SHA.
# Change lane_refs_json only when the repository intentionally uses other
# permanent lane names.

name: Merge policy

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  merge:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/merge'
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-merge-policy.yml@TOOL_CAD_CI_RELEASE_SHA
    with:
      command: ${{ github.event.comment.body }}
      pull_request_number: ${{ github.event.issue.number }}
      stable_ref: main
      lane_refs_json: '["dev-cad","dev-ci"]'
      permanent_refs_json: '["build","gh-pages"]'
      # Optional: add integration_workflow only when this repository has a
      # workflow_dispatch integration workflow to run after the merge.
