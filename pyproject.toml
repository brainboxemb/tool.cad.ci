[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainboxemb-cad-ci"
version = "0.18.0"
description = "Command-line interface for BrainboxEmb CAD CI"
requires-python = ">=3.11"
dependencies = [
  "brainboxemb-cad-ci-lib @ git+https://github.com/brainboxemb/lib.py.cad.ci.git@397fb04005b46de8d433cb18c091b1e73714b877"
]

[project.scripts]
cad-ci = "cad_ci_tool.cli:main"

[tool.setuptools]
packages = ["cad_ci_tool"]
