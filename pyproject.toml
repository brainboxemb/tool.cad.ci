[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainboxemb-cad-ci"
version = "0.16.0"
description = "Command-line interface for BrainboxEmb CAD CI"
requires-python = ">=3.11"
dependencies = [
  "brainboxemb-cad-ci-lib @ git+https://github.com/brainboxemb/lib.py.cad.ci.git@8403c426776dbad5beb17c35674562dc916e9a1f"
]

[project.scripts]
cad-ci = "cad_ci_tool.cli:main"

[tool.setuptools]
packages = ["cad_ci_tool"]
