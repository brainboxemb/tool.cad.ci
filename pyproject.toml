[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainboxemb-cad-ci"
version = "0.15.0"
description = "Command-line interface for BrainboxEmb CAD CI"
requires-python = ">=3.11"
dependencies = [
  "brainboxemb-cad-ci-lib @ git+https://github.com/brainboxemb/lib.py.cad.ci.git@4e033fd17e911b3feb92b1a34433b884ca788ab6"
]

[project.scripts]
cad-ci = "cad_ci_tool.cli:main"

[tool.setuptools]
packages = ["cad_ci_tool"]
