[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainboxemb-cad-ci"
version = "0.12.3"
description = "Command-line interface for BrainboxEmb CAD CI"
requires-python = ">=3.11"
dependencies = [
  "brainboxemb-cad-ci-lib @ git+https://github.com/brainboxemb/lib.py.cad.ci.git@c031f5dce3a4b0b207d8ce24716b5e11cdd12df2"
]

[project.scripts]
cad-ci = "cad_ci_tool.cli:main"

[tool.setuptools]
packages = ["cad_ci_tool"]
