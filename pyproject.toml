[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainboxemb-cad-ci"
version = "0.20.1"
description = "Command-line interface for BrainboxEmb CAD CI"
requires-python = ">=3.11"
dependencies = [
  "brainboxemb-cad-ci-lib @ git+https://github.com/brainboxemb/lib.py.cad.ci.git@e621daf6e309bdd0e3f643a12007f1b66490696d"
]

[project.scripts]
cad-ci = "cad_ci_tool.cli:main"

[tool.setuptools]
packages = ["cad_ci_tool"]
